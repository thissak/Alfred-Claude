<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>미국 10년물 국채금리 · stock.goldenlabs</title>
<link rel="icon" href="data:," />
<script src="https://unpkg.com/lightweight-charts@5.2.0/dist/lightweight-charts.standalone.production.js"></script>
<style>
  :root { --bg:#0e1116; --panel:#161b22; --line:#222b36; --text:#c9d1d9; --dim:#7d8590;
          --up:#e0455b; --down:#3b82f6; --gold:#e6b450; }
  * { box-sizing:border-box; }
  html, body { height:100%; }
  body { margin:0; background:var(--bg); color:var(--text); overflow:hidden;
         display:flex; flex-direction:column;
         font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo",sans-serif; }
  header { flex:0 0 auto; display:flex; align-items:center; gap:14px; padding:12px 18px;
           border-bottom:1px solid var(--line); background:var(--panel); position:relative; z-index:10; }
  .brand { font-weight:700; color:var(--gold); letter-spacing:.5px; }
  .navlink { color:var(--dim); text-decoration:none; font-size:13px; border:1px solid var(--line);
             border-radius:6px; padding:5px 10px; }
  .navlink:hover { color:var(--gold); border-color:var(--gold); }
  .title { font-size:15px; font-weight:600; }
  .ranges { margin-left:auto; display:flex; gap:6px; }
  .ranges button { padding:6px 12px; background:#0e1116; border:1px solid var(--line);
                   color:var(--dim); border-radius:6px; cursor:pointer; font-size:13px; }
  .ranges button.on { background:var(--gold); color:#0e1116; border-color:var(--gold); font-weight:600; }
  .ranges .divider { width:1px; align-self:stretch; background:var(--line); margin:2px 4px; }

  #main { flex:1 1 auto; display:flex; flex-direction:column; min-height:0; }
  #summary { flex:0 0 auto; display:flex; align-items:flex-end; gap:28px; padding:16px 22px 12px; flex-wrap:wrap; }
  .cur { display:flex; align-items:baseline; gap:10px; }
  .cur .val { font-size:40px; font-weight:700; font-variant-numeric:tabular-nums; line-height:1; }
  .cur .unit { font-size:20px; color:var(--dim); }
  .cur .chg { font-size:16px; font-weight:600; font-variant-numeric:tabular-nums; margin-left:4px; }
  .asof { color:var(--dim); font-size:12px; margin-top:6px; }
  .w52 { min-width:260px; }
  .w52 .lbl { color:var(--dim); font-size:12px; display:flex; justify-content:space-between; margin-bottom:5px; }
  .w52 .lbl b { color:var(--text); }
  .w52 .bar { position:relative; height:6px; background:#1a2129; border-radius:3px; }
  .w52 .fill { position:absolute; top:0; bottom:0; left:0; width:100%;
               background:linear-gradient(90deg,#3b82f6,#e6b450,#e0455b); border-radius:3px; opacity:.45; }
  .w52 .dot { position:absolute; top:-3px; width:12px; height:12px; border-radius:50%; background:var(--gold);
              border:2px solid #0e1116; transform:translateX(-50%); }
  .up { color:var(--up); } .down { color:var(--down); } .flat { color:var(--text); }

  #chartwrap { flex:1 1 auto; position:relative; min-width:0; }
  #chart { width:100%; height:100%; }
  .legend { position:absolute; top:8px; left:16px; z-index:5; pointer-events:none;
            font-size:13px; font-variant-numeric:tabular-nums; color:var(--dim); }
  .legend b { color:var(--text); font-size:15px; }
</style>
</head>
<body>
<header>
  <span class="brand">stock.goldenlabs</span>
  <a class="navlink" href="/">📈 차트</a>
  <a class="navlink" href="/notes">📋 후보</a>
  <span class="title">🇺🇸 미국 10년물 국채금리</span>
  <div class="ranges" id="ranges">
    <button data-tf="D">일</button>
    <button data-tf="W">주</button>
    <button data-tf="M">월</button>
    <span class="divider"></span>
    <button data-r="1y">1Y</button>
    <button data-r="3y">3Y</button>
    <button data-r="5y" class="on">5Y</button>
    <button data-r="10y">10Y</button>
    <button data-r="all">전체</button>
  </div>
</header>

<div id="main">
  <div id="summary">
    <div>
      <div class="cur" id="cur"></div>
      <div class="asof" id="asof"></div>
    </div>
    <div class="w52">
      <div class="lbl"><span>52주 저 <b id="w52l">-</b></span><span><b id="w52h">-</b> 52주 고</span></div>
      <div class="bar"><div class="fill"></div><div class="dot" id="w52dot" style="left:50%"></div></div>
    </div>
  </div>
  <div id="chartwrap">
    <div class="legend" id="legend"></div>
    <div id="chart"></div>
  </div>
</div>

<script>
const { createChart, AreaSeries, CrosshairMode } = LightweightCharts;
const GOLD = '#e6b450';
const fmtY = n => (n == null ? '-' : Number(n).toFixed(2));

const chart = createChart(document.getElementById('chart'), {
  autoSize: true,
  layout: { background:{color:'#0e1116'}, textColor:'#c9d1d9' },
  grid: { vertLines:{color:'#1a2129'}, horzLines:{color:'#1a2129'} },
  rightPriceScale: { borderColor:'#222b36' },
  timeScale: { borderColor:'#222b36', timeVisible:false, rightOffset:4 },
  crosshair: { mode: CrosshairMode.Normal },
  localization: { locale:'ko-KR', priceFormatter: p => p.toFixed(2) + '%' },
});
const area = chart.addSeries(AreaSeries, {
  lineColor:GOLD, topColor:'rgba(230,180,80,.28)', bottomColor:'rgba(230,180,80,.02)',
  lineWidth:2, priceLineVisible:true, priceLineColor:'rgba(230,180,80,.5)',
});

let curRange = '5y', curTf = null, valMap = {};

function highlightTf(tf) {
  document.querySelectorAll('#ranges button[data-tf]').forEach(x =>
    x.classList.toggle('on', x.dataset.tf === tf));
}

function renderSummary(d) {
  const cls = d.change_bp > 0 ? 'up' : d.change_bp < 0 ? 'down' : 'flat';
  const sign = d.change_bp > 0 ? '▲' : d.change_bp < 0 ? '▼' : '';
  const bp = (d.change_bp == null) ? '-' : Math.abs(d.change_bp).toFixed(1) + 'bp';
  document.getElementById('cur').innerHTML =
    `<span class="val ${cls}">${fmtY(d.current)}</span><span class="unit">%</span>` +
    `<span class="chg ${cls}">${sign} ${bp}</span>`;
  document.getElementById('asof').textContent = d.as_of ? `기준 ${d.as_of} · 전일종가 대비` : '';
  document.getElementById('w52l').textContent = fmtY(d.w52_low);
  document.getElementById('w52h').textContent = fmtY(d.w52_high);
  if (d.w52_low != null && d.w52_high != null && d.w52_high > d.w52_low && d.current != null) {
    const pos = Math.max(0, Math.min(100, (d.current - d.w52_low)/(d.w52_high - d.w52_low)*100));
    document.getElementById('w52dot').style.left = pos + '%';
  }
}

function renderLegend(time) {
  const key = (typeof time === 'string') ? time : null;
  const v = key && valMap[key] != null ? valMap[key] : null;
  document.getElementById('legend').innerHTML =
    v == null ? '' : `${key} &nbsp; <b>${v.toFixed(2)}%</b>`;
}
chart.subscribeCrosshairMove(p => renderLegend(p.time));

async function load(range, tf) {
  curRange = range; curTf = tf;
  const r = await fetch(`/api/rates?range=${range}` + (tf ? `&tf=${tf}` : ''));
  const d = await r.json();
  curTf = d.tf; highlightTf(d.tf);
  valMap = {};
  for (const p of (d.series || [])) valMap[p.time] = p.value;
  area.setData(d.series || []);
  chart.timeScale().fitContent();
  renderSummary(d);
}

document.getElementById('ranges').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  if (b.dataset.r) {
    document.querySelectorAll('#ranges button[data-r]').forEach(x => x.classList.remove('on'));
    b.classList.add('on');
    load(b.dataset.r, null);
  } else if (b.dataset.tf) {
    load(curRange, b.dataset.tf);
  }
});

load('5y');
</script>
</body>
</html>
